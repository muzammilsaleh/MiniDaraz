<h2>All Products</h2>
<ul>
  {% for product in products %}
    <li>
      <a href="{% url 'product_detail' product.id %}">
        {{ product.title }} - Rs.{{ product.price }}
      </a>
      <a href="{% url 'add_to_cart' product.id %}">🛒 Add to Cart</a>
    </li>
  {% empty %}
    <li>No products available</li>
  {% endfor %}
</ul>
