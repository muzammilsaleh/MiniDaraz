{% extends 'base.html' %}

{% block content %}
<h2>Confirm Delete</h2>
<p>Are you sure you want to delete "{{ product.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>
<form action="{% url 'product_list' %}" method="get">
    <button type="submit">Cancel</button>
</form>
{% endblock %}
