{% extends 'base.html' %}

{% block content %}
<h2>Add New Product</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add Product</button>
</form>

<form action="{% url 'product_list' %}" method="get">
    <button type="submit">⬅️ Back to Product List</button>
</form>
{% endblock %}
