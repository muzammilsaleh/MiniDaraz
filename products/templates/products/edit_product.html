{% extends 'base.html' %}

{% block content %}
<h2>Edit Product: {{ product.title }}</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Changes</button>
</form>
<form action="{% url 'product_list' %}" method="get">
    <button type="submit">⬅Back</button>
</form>
{% endblock %}
