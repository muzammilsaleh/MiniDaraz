<h2>My Orders</h2>
<ul>
  {% for order in orders %}
    <li>
      <form method="get" action="{% url 'order_detail' order.id %}">
        <button type="submit">Order #{{ order.id }} - Rs.{{ order.total_amount }} - {{ order.status }}</button>
      </form>
    </li>
  {% empty %}
    <li>No orders found.</li>
  {% endfor %}
</ul>
