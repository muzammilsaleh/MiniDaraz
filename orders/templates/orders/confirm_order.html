<h2>Confirm Order</h2>
<ul>
  {% for item in cart_items %}
    <li>{{ item.product.title }} - Rs.{{ item.product.price }} x {{ item.quantity }}</li>
  {% endfor %}
</ul>
<p>Total: Rs.{{ total_amount }}</p>

<form method="post" action="{% url 'place_order' %}">
  {% csrf_token %}
  <button type="submit">Place Order</button>
</form>
