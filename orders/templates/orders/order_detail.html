<h2>Order #{{ order.id }}</h2>
<p>Status: {{ order.status }}</p>
<p>Total: Rs.{{ order.total_amount }}</p>
<hr>
<ul>
  {% for item in order.items.all %}
    <li>{{ item.quantity }} x {{ item.product.title }} — Rs.{{ item.price }}</li>
  {% endfor %}
</ul>
<a href="{% url 'order_list' %}">← Back to Orders</a>
